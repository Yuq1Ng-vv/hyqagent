# taint_rules.yaml — Taint source / sink / sanitizer patterns
#
# Each language section defines patterns matched against AST node source
# text.  Grouped by vulnerability category for clarity.  Patterns use
# substring matching — no regex.
#
# Vulnerability categories:
#   sql_injection, command_injection, xss, path_traversal,
#   ssrf, deserialization, open_redirect, code_injection, auth_bypass

