# JavaScript / TypeScript
# ═══════════════════════════════════════════════════════════════════════════

javascript:
  sources:
    # ── Variable-agnostic HTTP input (Express / Koa / Fastify / Next.js) ──
    # .query matches req.query, request.query, ctx.query, etc.
    # .body matches req.body, request.body, ctx.request.body, etc.
    sql_injection:
      - .query
      - .body
      - .params
      - .cookies
      - .headers
      - location.search
      - URLSearchParams
      # Next.js App Router
      - searchParams
      # AWS Lambda
      - event.queryStringParameters
      - event.body
      - event.pathParameters
    command_injection:
      - .query
      - .body
      - .params
      - process.argv
      - process.env
    xss:
      - .query
      - .body
      - .params
      - .innerHTML
      - document.URL
      - location.href
      - location.hash
      - searchParams
    path_traversal:
      - .query
      - .params
      - .body
      - .files
      - searchParams
    ssrf:
      - .query
      - .body
      - .params
    deserialization:
      - .body
      - .serialize(
      # NOTE: JSON.parse was removed from deserialization sources —
      #   it produces plain objects, NEVER executes code.
      #   It is only a safe parser (listed in sanitizers).
    open_redirect:
      - .query
      - .params
    code_injection:
      - .query
      - .body
      - .params
    auth_bypass:
      - .cookies
      - .headers
      - .query

  sinks:
    sql_injection:
      # Raw query methods (variable-agnostic)
      - .query(
      - .execute(
      - .raw(
      # Sequelize / TypeORM
      - .sequelize.query(
      - .createQueryBuilder(
      # Knex / Drizzle / Slonik / Prisma
      - knex.raw(
      - knex(
      - sql.raw(
      - sql.unsafe(
      - $queryRaw(
      - $executeRaw(
      - $queryRawUnsafe(
      # Mongoose (NoSQL injection)
      - mongoose.Model.find(
      - mongoose.Model.findOne(
    command_injection:
      - child_process.exec(
      - child_process.spawn(
      - child_process.execFile(
      - child_process.fork(
      - exec(
      - spawn(
      - eval(
      # Modern alternatives
      - execa(
      - execa.command(
      - shelljs.exec(
      # zx library (Google's shell scripting for JS)
      - '$`'
    xss:
      - .innerHTML =
      - document.write(
      - .outerHTML =
      - insertAdjacentHTML(
      - dangerouslySetInnerHTML
      - React.createElement(
      - res.send(
      # Vue
      - v-html
      # Angular
      - bypassSecurityTrustHtml(
      - bypassSecurityTrustScript(
      - [innerHTML]
      # Svelte
      - '{@html '
      # DOM Range
      - createContextualFragment(
    path_traversal:
      - fs.readFile(
      - fs.readFileSync(
      - fs.createReadStream(
      - fs.writeFile(
      - fs.writeFileSync(
      - path.join(
      - path.resolve(
      - res.sendFile(
      - res.download(
      # Zip-slip (extraction)
      - adm-zip
      - unzipper
      - extract-zip
    ssrf:
      - fetch(
      - axios.get(
      - axios.post(
      - request(
      - http.get(
      - https.get(
      - node-fetch
      - got(
      # Modern HTTP clients
      - superagent(
      - needle(
      - undici.request(
      - undici.fetch(
      - bent(
      - ky(
    deserialization:
      - eval(
      - new Function(
      - vm.runInNewContext(
      - vm.run(
      - serialize.unserialize(
      - node-serialize.unserialize(
      - funcster(
    open_redirect:
      - res.redirect(
      - window.location =
      - location.replace(
    code_injection:
      - eval(
      - new Function(
      - vm.run(
      - vm.runInNewContext(
      - vm.runInThisContext(
    auth_bypass:
      - req.isAuthenticated(
      - req.user
      - req.session

  sanitizers:
    sql_injection:
      - parseInt(
      - parseFloat(
      - .escape(
      - validator.escape(
      - sanitize(
      - escape(
      - encodeURI(
      - encodeURIComponent(
      # NOTE: Number( and String( were removed — type coercion does not
      #   prevent SQL injection if the result is concatenated into a query.
      # NOTE: .bind( was removed — matches Function.prototype.bind,
      #   React event binding, etc. universally.
    command_injection:
      - shellescape(
    xss:
      - escape(
      - encodeURI(
      - encodeURIComponent(
      - DOMPurify.sanitize(
      - validator.escape(
      - sanitizeHtml(
      - escapeHtml(
    path_traversal:
      - path.basename(
      - path.normalize(
    auth_bypass:
      - bcrypt.compare(
      - jwt.verify(
    ssrf:
      - url.parse(
      - new URL(
    deserialization:
      - JSON.parse
      - validator.isJSON(
    open_redirect:
      - url.resolve(
      # NOTE: path.join( was removed — it joins path segments but does
      #   NOT validate URLs or prevent open redirects.
    code_injection:
      - parseInt(
      # NOTE: String( was removed — same rationale as for sql_injection.


