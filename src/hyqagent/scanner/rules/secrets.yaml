# Hardcoded secrets detection rules.
# Substring matching (case-insensitive unless (?i) prefix for regex patterns).
# Each rule produces a deterministic Finding.

rules:
  - id: SECRET-001
    patterns:
      - '(?i)(password|passwd|pwd)\s*[:=]\s*["''][^"'']{4,}["'']'
    severity: high
    message: "硬编码密码"
    category: "hardcoded_secret"

  - id: SECRET-002
    patterns:
      - '(?i)(secret_key|secretKey|SECRET_KEY|api_key|apiKey|API_KEY)\s*[:=]\s*["''][^"'']{8,}["'']'
    severity: critical
    message: "硬编码密钥/Token"
    category: "hardcoded_secret"

  - id: SECRET-003
    patterns:
      - '(?i)(private_key|privateKey|PRIVATE_KEY)\s*[:=]\s*["''][^"'']+["'']'
    severity: critical
    message: "硬编码私钥"
    category: "hardcoded_secret"

  - id: SECRET-004
    patterns:
      - '(?i)(access_key|accessKey|ACCESS_KEY)\s*[:=]\s*["''][^"'']+["'']'
    severity: high
    message: "硬编码 Access Key"
    category: "hardcoded_secret"

  - id: SECRET-005
    patterns:
      - '(?i)(database_url|DATABASE_URL|db_url|DB_URL)\s*[:=]\s*["''][^"'']+["'']'
    severity: medium
    message: "硬编码数据库连接字符串"
    category: "hardcoded_secret"

  - id: SECRET-006
    patterns:
      - '(?i)(jwt_secret|JWT_SECRET|jwt_key)\s*[:=]\s*["''][^"'']+["'']'
    severity: high
    message: "硬编码 JWT 密钥"
    category: "hardcoded_secret"

  - id: SECRET-007
    patterns:
      - '(?i)(aws_secret|AWS_SECRET|aws_key|AWS_KEY)\s*[:=]\s*["''][^"'']+["'']'
    severity: critical
    message: "硬编码 AWS 凭证"
    category: "hardcoded_secret"

  - id: SECRET-008
    patterns:
      - '(?i)(token|auth_token|bearer)\s*[:=]\s*["''][A-Za-z0-9+/=]{20,}["'']'
    severity: high
    message: "硬编码认证 Token"
    category: "hardcoded_secret"

  - id: SECRET-009
    patterns:
      - '(?i)connectionString\s*[:=]\s*["''][^"'']+["'']'
    severity: medium
    message: "硬编码数据库连接串 (Java/C#)"
    category: "hardcoded_secret"

  - id: SECRET-010
    patterns:
      - '(?i)(api_token|apiToken|API_TOKEN)\s*[:=]\s*["''][^"'']+["'']'
    severity: high
    message: "硬编码 API Token"
    category: "hardcoded_secret"
