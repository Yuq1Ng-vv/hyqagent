# Dangerous function call detection rules.
# Substring matching. Patterns are checked against source text.

rules:
  # ── Dynamic code execution ──────────────────────────────────────────
  - id: DANGER-001
    patterns: ['eval(', 'exec(', 'Function(']
    severity: high
    message: "动态代码执行"
    languages: [python, javascript]
    cwe: "CWE-95"

  - id: DANGER-002
    patterns: ['vm.runInNewContext(', 'vm.runInThisContext(', 'vm.compileFunction(']
    severity: high
    message: "Node.js 沙箱执行"
    languages: [javascript]
    cwe: "CWE-95"

  # ── Command execution ───────────────────────────────────────────────
  - id: DANGER-003
    patterns: ['os.system(', 'os.popen(']
    severity: high
    message: "操作系统命令执行"
    languages: [python]
    cwe: "CWE-78"

  - id: DANGER-004
    patterns: ['subprocess.call(', 'subprocess.Popen(', 'subprocess.run(',
               'subprocess.check_output(', 'subprocess.check_call(']
    severity: high
    message: "子进程命令执行"
    languages: [python]
    cwe: "CWE-78"

  - id: DANGER-005
    patterns: ['Runtime.getRuntime().exec(', 'ProcessBuilder(']
    severity: high
    message: "Java 命令执行"
    languages: [java]
    cwe: "CWE-78"

  - id: DANGER-006
    patterns: ['child_process.exec(', 'child_process.spawn(',
               'child_process.execSync(', 'child_process.spawnSync(']
    severity: high
    message: "Node.js 命令执行"
    languages: [javascript]
    cwe: "CWE-78"

  # ── Unsafe deserialization ──────────────────────────────────────────
  - id: DANGER-007
    patterns: ['pickle.loads(', 'pickle.load(', 'marshal.loads(',
               'yaml.load(', 'yaml.unsafe_load(']
    severity: high
    message: "不安全的 Python 反序列化"
    languages: [python]
    cwe: "CWE-502"

  - id: DANGER-008
    patterns: ['ObjectInputStream(', 'readObject(']
    severity: medium
    message: "Java 反序列化（需配合用户可控输入评估）"
    languages: [java]
    cwe: "CWE-502"

  # ── File operations ─────────────────────────────────────────────────
  - id: DANGER-009
    patterns: ['fs.readFile(', 'fs.writeFile(', 'fs.readFileSync(',
               'fs.writeFileSync(']
    severity: medium
    message: "文件读写（检查路径是否用户可控）"
    languages: [javascript]
    cwe: "CWE-73"

  - id: DANGER-010
    patterns: ['open(', 'file(']
    severity: low
    message: "文件操作（检查路径是否用户可控）"
    languages: [python]
    cwe: "CWE-73"

  # ── XPATH / LDAP injection sinks ────────────────────────────────────
  - id: DANGER-011
    patterns: ['XPath.evaluate(', 'XPath.compile(']
    severity: medium
    message: "XPath 查询（可能 XPath 注入）"
    languages: [java]
    cwe: "CWE-643"

  - id: DANGER-012
    patterns: ['ldap.search(', 'ldapSearch(']
    severity: medium
    message: "LDAP 查询（可能 LDAP 注入）"
    languages: [java]
    cwe: "CWE-90"

  # ── Template rendering (SSTI risk) ──────────────────────────────────
  - id: DANGER-013
    patterns: ['render_template_string(', 'jinja2.Template(']
    severity: medium
    message: "Jinja2 模板渲染（可能 SSTI）"
    languages: [python]
    cwe: "CWE-1336"

  - id: DANGER-014
    patterns: ['Freemarker', 'Template.process(']
    severity: medium
    message: "模板引擎渲染（可能 SSTI）"
    languages: [java]
    cwe: "CWE-1336"

  # ── Reflection / Dynamic invocation ─────────────────────────────────
  - id: DANGER-015
    patterns: ['Method.invoke(', 'Class.forName(']
    severity: low
    message: "Java 反射调用"
    languages: [java]
    cwe: "CWE-470"

  - id: DANGER-016
    patterns: ['getattr(', 'setattr(', '__import__(']
    severity: low
    message: "Python 动态属性/导入"
    languages: [python]
    cwe: "CWE-470"

  # ── JNDI injection / Log4Shell ──────────────────────────────────────
  - id: DANGER-017
    patterns:
      - 'InitialContext.lookup('
      - 'InitialDirContext.lookup('
      - 'Context.lookup('
      - 'javax.naming.InitialContext'
      - 'jakarta.naming.InitialContext'
      - 'NamingManager.getObjectInstance('
    severity: critical
    message: "JNDI 注入 — 用户可控的 lookup() 可能导致远程代码执行"
    languages: [java]
    cwe: "CWE-917"

  - id: DANGER-018
    patterns:
      - 'log4j'
      - 'log4j-core'
      - 'JndiLookup'
      - '${jndi:'
    severity: critical
    message: "Log4Shell 特征 — 检测 log4j JNDI 查询注入风险"
    languages: [java]
    cwe: "CWE-917"

  # ── Expression Language injection ───────────────────────────────────
  - id: DANGER-019
    patterns:
      - 'SpelExpressionParser'
      - 'ExpressionParser.parseExpression('
      - 'spelExpressionParser'
      - 'StandardEvaluationContext'
    severity: high
    message: "Spring SpEL 表达式注入 — 用户可控表达式可能导致 RCE"
    languages: [java]
    cwe: "CWE-917"

  - id: DANGER-020
    patterns:
      - 'Ognl.parseExpression('
      - 'Ognl.getValue('
      - 'Ognl.setValue('
      - 'ognl.Ognl'
    severity: critical
    message: "OGNL 表达式注入 — Struts2 S2-* 系列漏洞核心"
    languages: [java]
    cwe: "CWE-917"

  - id: DANGER-021
    patterns:
      - 'MVEL.eval('
      - 'MVEL.executeExpression('
      - 'JexlEngine.createExpression('
      - 'JexlExpression.evaluate('
    severity: high
    message: "MVEL/JEXL 表达式注入"
    languages: [java]
    cwe: "CWE-917"

  # ── Unsafe deserialization (Java expanded) ──────────────────────────
  - id: DANGER-022
    patterns:
      - 'JSON.parseObject('
      - 'JSON.parse('
      - 'com.alibaba.fastjson.JSON'
      - 'com.alibaba.fastjson2.JSON'
    severity: critical
    message: "Fastjson 反序列化 — 已知大量 RCE gadget chain"
    languages: [java]
    cwe: "CWE-502"

  - id: DANGER-023
    patterns:
      - 'Yaml.load('
      - 'Yaml.loadAs('
      - 'Yaml.loadAll('
      - 'new Yaml('
    severity: high
    message: "SnakeYAML 不安全加载 — 需使用 SafeConstructor"
    languages: [java]
    cwe: "CWE-502"

  - id: DANGER-024
    patterns:
      - '.enableDefaultTyping('
      - 'ObjectMapper.enableDefaultTyping('
      - 'ObjectMapper.activateDefaultTyping('
    severity: high
    message: "Jackson 启用 DefaultTyping — 多态反序列化 RCE 风险"
    languages: [java]
    cwe: "CWE-502"

  # ── XXE (expanded) ──────────────────────────────────────────────────
  - id: DANGER-025
    patterns:
      - 'DocumentBuilderFactory.newInstance()'
      - '.newDocumentBuilder()'
    severity: high
    message: "XML DocumentBuilder 创建 — 需禁用外部实体以避免 XXE"
    languages: [java]
    cwe: "CWE-611"

  - id: DANGER-026
    patterns:
      - 'SAXParserFactory.newInstance()'
      - 'XMLInputFactory.newFactory()'
      - 'XMLInputFactory.newInstance()'
    severity: high
    message: "XML 解析器工厂创建 — 需安全配置以避免 XXE"
    languages: [java]
    cwe: "CWE-611"

  - id: DANGER-027
    patterns:
      - 'JAXBContext.newInstance('
      - 'Unmarshaller.unmarshal('
      - 'javax.xml.bind.Unmarshaller'
      - 'jakarta.xml.bind.Unmarshaller'
    severity: high
    message: "JAXB 反序列化 — 默认配置易受 XXE 攻击"
    languages: [java]
    cwe: "CWE-611"

  # ── Template injection (SSTI) ───────────────────────────────────────
  - id: DANGER-028
    patterns:
      - 'Velocity.evaluate('
      - 'Velocity.mergeTemplate('
      - 'Velocity.eval('
      - 'VelocityContext.put('
    severity: high
    message: "Apache Velocity 模板注入 — 用户可控变量/模板可能导致 SSTI"
    languages: [java]
    cwe: "CWE-1336"

  - id: DANGER-029
    patterns:
      - 'TemplateEngine.process('
      - 'SpringTemplateEngine.process('
      - 'Thymeleaf'
    severity: high
    message: "Thymeleaf 模板引擎 — 用户可控模板可能导致 SSTI"
    languages: [java]
    cwe: "CWE-1336"

  - id: DANGER-030
    patterns:
      - 'PebbleEngine'
      - 'PebbleTemplate.evaluate('
      - 'Mustache.execute('
      - 'MustacheFactory.compile('
      - 'Handlebars.compile('
    severity: medium
    message: "模板引擎渲染 (Pebble/Mustache/Handlebars)"
    languages: [java]
    cwe: "CWE-1336"

  # ── LDAP injection (expanded) ───────────────────────────────────────
  - id: DANGER-031
    patterns:
      - 'LdapTemplate.search('
      - 'LdapTemplate.find('
      - 'LdapTemplate.findOne('
      - 'LdapTemplate.authenticate('
      - 'LdapQueryBuilder.query('
      - 'DirContext.search('
    severity: high
    message: "LDAP 查询注入 — 用户输入混入 LDAP 过滤器"
    languages: [java]
    cwe: "CWE-90"

  # ── XPath injection (expanded) ──────────────────────────────────────
  - id: DANGER-032
    patterns:
      - 'XPathFactory.newInstance()'
      - 'XPathExpression.evaluate('
      - 'Document.selectNodes('
      - 'DocumentHelper.selectNodes('
      - 'Node.selectNodes('
    severity: medium
    message: "XPath 注入 — 用户可控 XPath 查询"
    languages: [java]
    cwe: "CWE-643"

  # ── NoSQL injection ─────────────────────────────────────────────────
  - id: DANGER-033
    patterns:
      - 'BasicDBObject('
      - 'Document.parse('
      - 'Filters.regex('
      - 'Filters.where('
      - 'collection.find('
    severity: high
    message: "NoSQL 注入 — MongoDB/NoSQL 查询可能由用户输入构造"
    languages: [java]
    cwe: "CWE-943"

  # ── SQL injection (heuristic) ───────────────────────────────────────
  - id: DANGER-034
    patterns:
      - 'Statement.execute('
      - 'Statement.executeQuery('
      - 'Statement.executeUpdate('
      - '.createStatement('
    severity: high
    message: "JDBC Statement（非 PreparedStatement）— 可能 SQL 注入"
    languages: [java]
    cwe: "CWE-89"

  # ── Weak cryptography ───────────────────────────────────────────────
  - id: DANGER-035
    patterns:
      - 'MessageDigest.getInstance("MD5")'
      - 'MessageDigest.getInstance("MD4")'
      - 'MessageDigest.getInstance("SHA-1")'
      - 'MessageDigest.getInstance("SHA1")'
    severity: high
    message: "弱哈希算法 — MD5/SHA-1 已被破解"
    languages: [java]
    cwe: "CWE-328"

  - id: DANGER-036
    patterns:
      - 'Cipher.getInstance("DES")'
      - 'Cipher.getInstance("RC2")'
      - 'Cipher.getInstance("RC4")'
      - 'Cipher.getInstance("Blowfish")'
      - 'Cipher.getInstance("AES/ECB'
    severity: high
    message: "弱加密算法 — DES/RC4/ECB 模式不安全"
    languages: [java]
    cwe: "CWE-327"

  # ── Insecure random ─────────────────────────────────────────────────
  - id: DANGER-037
    patterns:
      - 'new Random('
      - 'SecureRandom.setSeed('
    severity: medium
    message: "不安全的随机数生成 — Random() 不适用于安全场景"
    languages: [java]
    cwe: "CWE-330"

  # ── Insecure TLS/SSL ────────────────────────────────────────────────
  - id: DANGER-038
    patterns:
      - 'SSLContext.getInstance("TLSv1")'
      - 'SSLContext.getInstance("TLSv1.1")'
      - 'SSLContext.getInstance("SSLv3")'
    severity: high
    message: "不安全的 TLS 版本 — TLSv1/SSLv3 已被弃用"
    languages: [java]
    cwe: "CWE-326"

  - id: DANGER-039
    patterns:
      - 'TrustManager'
      - 'X509TrustManager'
      - 'checkClientTrusted'
      - 'checkServerTrusted'
    severity: medium
    message: "自定义 TrustManager — 可能信任所有证书"
    languages: [java]
    cwe: "CWE-295"

  # ── Dynamic code execution (Java) ───────────────────────────────────
  - id: DANGER-040
    patterns:
      - 'GroovyShell.evaluate('
      - 'GroovyShell.parse('
      - 'GroovyClassLoader.parseClass('
    severity: high
    message: "Groovy 动态代码执行"
    languages: [java]
    cwe: "CWE-95"

  - id: DANGER-041
    patterns:
      - 'ScriptEngine.eval('
      - 'ScriptEngineManager.getEngineByName('
      - 'NashornScriptEngine'
      - 'Context.eval('
    severity: high
    message: "脚本引擎 eval — 用户可控代码执行"
    languages: [java]
    cwe: "CWE-95"

  - id: DANGER-042
    patterns:
      - 'bsh.Interpreter'
      - 'Interpreter.eval('
      - 'Interpreter.source('
    severity: high
    message: "BeanShell 脚本执行"
    languages: [java]
    cwe: "CWE-95"

  # ── Hardcoded secrets ───────────────────────────────────────────────
  - id: DANGER-043
    patterns:
      - 'String password = "'
      - 'String apiKey = "'
      - 'String secretKey = "'
      - 'String token = "'
    severity: medium
    message: "疑似硬编码密钥 — 检查是否为占位符/示例值"
    languages: [java]
    cwe: "CWE-798"

  - id: DANGER-044
    patterns:
      - 'BasicAWSCredentials('
      - 'AWSCredentials('
    severity: high
    message: "硬编码 AWS 凭证"
    languages: [java]
    cwe: "CWE-798"

  # ── CRLF / HTTP header injection ────────────────────────────────────
  - id: DANGER-045
    patterns:
      - 'MimeMessage.setSubject('
      - 'MimeMessage.setText('
      - 'Transport.send('
    severity: low
    message: "邮件发送 — 检查用户输入是否包含 CRLF 注入"
    languages: [java]
    cwe: "CWE-93"

  # ── ProcessBuilder / Command injection (expanded) ───────────────────
  - id: DANGER-046
    patterns:
      - 'CommandLine.parse('
      - 'DefaultExecutor.execute('
      - 'ChannelExec.setCommand('
    severity: high
    message: "命令执行扩展 — Commons Exec / JSch 远程命令"
    languages: [java]
    cwe: "CWE-78"

  # ── Path Traversal (Java) ────────────────────────────────────────────
  - id: DANGER-047
    patterns:
      - 'new File('
      - 'new FileInputStream('
      - 'new FileOutputStream('
      - 'new FileReader('
      - 'new FileWriter('
      - 'new RandomAccessFile('
    severity: high
    message: "文件路径操作 — 使用用户可控的路径可能导致目录遍历 (CWE-22)"
    languages: [java]
    cwe: "CWE-22"
    category: path_traversal

  - id: DANGER-048
    patterns:
      - 'Files.read('
      - 'Files.copy('
      - 'Files.write('
      - 'Files.move('
      - 'Files.newInputStream('
      - 'Files.newOutputStream('
      - 'Files.createFile('
      - 'Files.delete('
      - 'Files.walk('
      - 'Files.list('
      - 'Files.readAllBytes('
      - 'Files.readString('
      - 'Files.writeString('
    severity: high
    message: "NIO Files 操作 — 用户可控的路径可能导致目录遍历 (CWE-22)"
    languages: [java]
    cwe: "CWE-22"
    category: path_traversal

  - id: DANGER-049
    patterns:
      - 'Paths.get('
      - '.resolve('
      - '.normalize('
      - '.toAbsolutePath('
    severity: medium
    message: "NIO Path 操作 — 用户可控的路径可能导致路径遍历 (CWE-22)"
    languages: [java]
    cwe: "CWE-22"
    category: path_traversal

  - id: DANGER-050
    patterns:
      - 'ClassLoader.getResource('
      - '.getResource('
      - '.getResourceAsStream('
    severity: medium
    message: "ClassLoader 资源访问 — 用户可控的资源路径 (CWE-22)"
    languages: [java]
    cwe: "CWE-22"
    category: path_traversal

  - id: DANGER-051
    patterns:
      - 'ServletContext.getResource('
      - 'ServletContext.getResourceAsStream('
      - 'ServletContext.getRealPath('
      - 'MultipartFile.transferTo('
    severity: high
    message: "Web 资源路径操作 — 用户可控的文件路径 (CWE-22)"
    languages: [java]
    cwe: "CWE-22"
    category: path_traversal

  - id: DANGER-052
    patterns:
      - 'ZipEntry('
      - 'ZipFile('
      - 'TarArchiveEntry('
      - 'TarArchiveInputStream('
    severity: medium
    message: "压缩文件条目 — 用户可控的路径可能导致 Zip Slip (CWE-22)"
    languages: [java]
    cwe: "CWE-22"
    category: path_traversal
